  <script>
    // Number to Words (Indian system)
    function numberToWords(num) {
      const a = ['', 'one', 'two', 'three', 'four', 'five', 'six', 'seven', 'eight', 'nine', 'ten',
        'eleven', 'twelve', 'thirteen', 'fourteen', 'fifteen', 'sixteen', 'seventeen', 'eighteen', 'nineteen'];
      const b = ['', '', 'twenty', 'thirty', 'forty', 'fifty', 'sixty', 'seventy', 'eighty', 'ninety'];
      if ((num = num.toString()).length > 9) return 'overflow';
      let n = ('000000000' + num).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
      if (!n) return '';
      let str = '';
      str += (n[1] != 0) ? (a[Number(n[1])] || b[n[1][0]] + ' ' + a[n[1][1]]) + ' crore ' : '';
      str += (n[2] != 0) ? (a[Number(n[2])] || b[n[2][0]] + ' ' + a[n[2][1]]) + ' lakh ' : '';
      str += (n[3] != 0) ? (a[Number(n[3])] || b[n[3][0]] + ' ' + a[n[3][1]]) + ' thousand ' : '';
      str += (n[4] != 0) ? (a[Number(n[4])] || b[n[4][0]] + ' ' + a[n[4][1]]) + ' hundred ' : '';
      str += (n[5] != 0) ? ((str != '') ? 'and ' : '') + (a[Number(n[5])] || b[n[5][0]] + ' ' + a[n[5][1]]) : '';
      return str.trim();
    }

    function calculateSipMaturity(sip, years, annualRate) {
      const months = years * 12;
      const monthlyRate = annualRate / 12 / 100;
      if (months <= 0) return 0;
      if (monthlyRate === 0) return sip * months;
      return sip * ((Math.pow(1 + monthlyRate, months) - 1) / monthlyRate) * (1 + monthlyRate);
    }

    function formatCurrency(value) {
      return "₹" + Math.round(value).toLocaleString("en-IN");
    }

    function getNonNegativeValue(id) {
      const value = Number.parseFloat(document.getElementById(id).value);
      return Number.isFinite(value) ? Math.max(0, value) : 0;
    }

    let returnMode = false;

    function updateModeUI() {
      document.body.classList.toggle("return-mode", returnMode);
      document.getElementById("calculatorTitle").textContent = returnMode
        ? "Return Calculator"
        : "SIP + Lump Sum Calculator";
      document.getElementById("sipLabel").textContent = returnMode
        ? "Initial Investment (₹)"
        : "Monthly SIP Investment (₹)";
      document.getElementById("currentValueLabel").hidden = !returnMode;
      document.getElementById("currentValue").hidden = !returnMode;
      document.getElementById("lumpsumLabel").hidden = returnMode;
      document.getElementById("lumpsum").hidden = returnMode;
      document.getElementById("yearsLabel").textContent = returnMode
        ? "Investment Period (Years)"
        : "Investment Period (Years)";
      document.getElementById("rateLabel").hidden = returnMode;
      document.getElementById("rate").hidden = returnMode;
      document.getElementById("projectionTitle").textContent = returnMode
        ? "Projected Investment Value"
        : "Projected SIP Corpus";
      document.getElementById("projectionNote").textContent = returnMode
        ? "Based on the initial investment. Compare estimated values across return assumptions."
        : "Based on the monthly SIP entered above. Compare estimated maturity values across return assumptions.";
      document.getElementById("projectionAmountHeader").textContent = returnMode
        ? "Initial Investment"
        : "Total Invested";
      document.getElementById("modeButton").textContent = returnMode
        ? "SIP calculator"
        : "Return calculator";
      calculate();
    }

    function updateProjection() {
      const sip = getNonNegativeValue("sip");
      const rates = [12, 15, 18];
      const yearsList = [5, 10, 20, 25, 30, 35];
      const rows = yearsList.map(years => ({
        years,
        invested: returnMode ? sip : sip * years * 12,
        values: Object.fromEntries(rates.map(rate => [
          rate,
          returnMode
            ? sip * Math.pow(1 + rate / 100, years)
            : calculateSipMaturity(sip, years, rate)
        ]))
      }));

      document.getElementById("projectionBody").innerHTML = rows.map(row => `
        <tr>
          <td>${row.years}</td>
          <td>${formatCurrency(row.invested)}</td>
          ${rates.map(rate => `<td>${formatCurrency(row.values[rate])}</td>`).join("")}
        </tr>
      `).join("");
    }

    // Calculator
    function calculate() {
      let sip = getNonNegativeValue("sip");
      let lumpsum = getNonNegativeValue("lumpsum");
      let years = getNonNegativeValue("years");
      let rate = getNonNegativeValue("rate");

      if (returnMode) {
        const currentValue = getNonNegativeValue("currentValue");
        if (currentValue <= 0) {
          document.getElementById("result").innerHTML =
            "<strong>Enter your current investment value to calculate the return.</strong>";
          updateProjection();
          return;
        }
        const maturityAmount = currentValue;
        const gain = maturityAmount - sip;
        const returnPercentage = sip > 0 ? (gain / sip) * 100 : 0;
        const annualizedReturn = sip > 0 && years > 0
          ? (Math.pow(maturityAmount / sip, 1 / years) - 1) * 100
          : 0;
        document.getElementById("result").innerHTML = `
          <strong>Initial Investment:</strong> ₹${sip.toFixed(2)}<br>
          <strong>Current Value:</strong> ₹${maturityAmount.toFixed(2)}<br>
          <strong>Total Return:</strong> ₹${gain.toFixed(2)}<br>
          <strong>Return Percentage:</strong> ${returnPercentage.toFixed(2)}%<br><br>
          <strong>Annualized Return:</strong> ${annualizedReturn.toFixed(2)}%<br>
          (${numberToWords(Math.floor(maturityAmount))})
        `;
        updateProjection();
        return;
      }

      let months = years * 12;
      let monthlyRate = rate / 12 / 100;

      let sipMaturity = calculateSipMaturity(sip, years, rate);
      let lumpsumMaturity = lumpsum * Math.pow(1 + monthlyRate, months);

      let totalInvested = (sip * months) + lumpsum;
      let maturityAmount = sipMaturity + lumpsumMaturity;
      let gain = maturityAmount - totalInvested;

      document.getElementById("result").innerHTML = `
        <strong>Total Invested Amount:</strong> ₹${totalInvested.toFixed(2)}<br>
        (${numberToWords(Math.floor(totalInvested))})<br><br>
        <strong>Estimated Maturity Amount:</strong> ₹${maturityAmount.toFixed(2)}<br>
        (${numberToWords(Math.floor(maturityAmount))})
      `;

      updateProjection();
    }

    // Ad Slider
    document.addEventListener("DOMContentLoaded", function() {
      const themeButton = document.getElementById("themeButton");
      const modeButton = document.getElementById("modeButton");
      const moreMenu = document.querySelector(".more-menu");
      const savedTheme = localStorage.getItem("sipcalc_theme");
      returnMode = false;
      if (savedTheme === "dark") document.body.classList.add("dark-theme");
      themeButton.addEventListener("click", function() {
        const isDark = document.body.classList.toggle("dark-theme");
        localStorage.setItem("sipcalc_theme", isDark ? "dark" : "light");
        moreMenu.open = false;
      });
      modeButton.addEventListener("click", function() {
        window.location.href = "return-calculator.html";
      });

      const rightPanel = document.querySelector(".right-panel");
      const projectionSection = document.querySelector(".projection-section");
      const adPanel = document.getElementById("adPanel");
      rightPanel.prepend(projectionSection);
      const secondAdPanel = adPanel.cloneNode(true);
      secondAdPanel.id = "adPanelSecond";
      secondAdPanel.querySelector("#adSlider").id = "adSliderSecond";
      const adGrid = document.createElement("div");
      adGrid.className = "ad-grid";
      adGrid.append(adPanel, secondAdPanel);
      rightPanel.append(adGrid);

      const adSliders = [
        document.getElementById("adSlider"),
        document.getElementById("adSliderSecond")
      ];
      let currentAdIndex = 0;
      const totalAds = adSliders[0].querySelectorAll(".ad-slide").length;

      function showAd(slider, index) {
        slider.style.transform = `translateX(-${index * 100}%)`;
      }

      function showDifferentAds() {
        showAd(adSliders[0], currentAdIndex);
        showAd(adSliders[1], (currentAdIndex + 1) % totalAds);
      }

      showDifferentAds();
      setInterval(() => {
        currentAdIndex = (currentAdIndex + 1) % totalAds;
        showDifferentAds();
      }, 5000);

      updateModeUI();
    });

    window.onerror = function(message) {
      document.getElementById('adError').textContent = "An error occurred: " + message;
      return false;
    };

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('Service Worker registered!', reg))
          .catch(err => console.log('Service Worker registration failed:', err));
      });
    }
  </script>
</body>
</html>
